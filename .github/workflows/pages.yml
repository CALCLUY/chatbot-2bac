name: Deploy chatbot to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/01a0b4c3-chatbot-2bac
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject testing relay key
        env:
          CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
        run: |
          test -n "$CHAT_API_KEY"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('web/index.html')
          text = p.read_text()
          key = os.environ['CHAT_API_KEY']
          if '__CHAT_API_KEY__' not in text:
              raise SystemExit('API key placeholder not found')
          p.write_text(text.replace('__CHAT_API_KEY__', key))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
